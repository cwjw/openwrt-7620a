name: Build MT7620A Firmware

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt 源码分支'
        required: true
        default: 'openwrt-24.10'
      tag:
        description: '构建成功后发布 Release 的 tag 名（留空只上传 Artifact）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.branch || 'openwrt-24.10' }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 检出构建配置
        uses: actions/checkout@v5

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: true
          swap-storage: false

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pip python3-ply rsync unzip zlib1g-dev file wget qemu-utils ccache
          sudo timedatectl set-timezone Asia/Shanghai || true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 缓存下载目录
        uses: actions/cache@v5
        with:
          path: openwrt/dl
          key: dl-${{ env.REPO_BRANCH }}-${{ hashFiles('configs/*.config') }}
          restore-keys: |
            dl-${{ env.REPO_BRANCH }}-

      - name: 缓存 ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ env.REPO_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.REPO_BRANCH }}-

      - name: 克隆源码
        run: |
          git clone --depth=1 -b "${{ env.REPO_BRANCH }}" "${{ env.REPO_URL }}" openwrt
          cd openwrt && git log -1 --pretty=format:'源码版本: %h %s%n'

      - name: 加载 feeds 与种子配置（第一步）
        run: |
          cd openwrt
          cp ../configs/mt7620a-16m.config .config
          if [ -f ../feeds.conf ]; then cp ../feeds.conf feeds.conf; fi
          bash ../scripts/diy-part1.sh
          make defconfig

      - name: 注入自定义内容（第二步）
        run: |
          cd openwrt
          bash ../scripts/diy-part2.sh

      - name: 校验目标与板型
        run: |
          cd openwrt
          echo "=== 已选中的板型 ==="
          grep -E "CONFIG_TARGET_ramips_mt7620_DEVICE_" .config || (echo "未选中任何板型，终止" && exit 1)
          echo "=== 已选中的自定义包 ==="
          grep -E "CONFIG_PACKAGE_(luci|block-mount|ttyd|htop)=" .config | head -40

      - name: 下载源码包
        run: |
          cd openwrt
          make -j$(nproc) download || make -j1 V=s download

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) 2>&1 | tee build.log

      - name: 收集固件
        if: success()
        run: |
          mkdir -p output
          find openwrt/bin/targets/ramips/mt7620 -maxdepth 1 -type f \
            \( -name "*.bin" -o -name "*.itb" -o -name "sha256sums" \) \
            -exec cp {} output/ \;
          cd output
          ls -lh
          sha256sum $(ls | grep -v SHA256SUMS.txt) > SHA256SUMS.txt || true

      - name: 上传固件 Artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: mt7620a-firmware-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: success() && (github.event.inputs.tag != '' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: MT7620A 固件 ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            自动云编译产物（ImmortalWrt ${{ env.REPO_BRANCH }}，ramips/mt7620）。
            刷机前请先确认机型与闪存容量，见仓库 README。
          files: output/*
          draft: false
          prerelease: false

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ github.run_number }}
          path: openwrt/build.log
          if-no-files-found: ignore
