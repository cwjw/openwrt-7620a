name: Build MT7620A Firmware

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'ImmortalWrt 源码分支'
        required: true
        default: 'openwrt-24.10'
      tag:
        description: '构建成功后发布 Release 的 tag 名（留空只上传 Artifact）'
        required: false
        default: ''
  workflow_call:
    inputs:
      branch:
        description: 'ImmortalWrt 源码分支'
        type: string
        required: false
        default: 'openwrt-24.10'
      tag:
        description: '发布 Release 的 tag 名（留空只传 Artifact）'
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'v*'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.branch || inputs.branch || 'openwrt-24.10' }}
  TZ: Asia/Shanghai
  DEVICE_ID: 7620a_cpe-16m
  # 原厂 tx20-stock-firmware.bin = 11272192 B = 0xAC0000，与 DTS 的
  # firmware 分区 0x50000+0xAC0000 等长。以前用 11534336 会让镜像尾部越过
  # 分区 0x40000、写穿到原厂 jffs2 起点 0xB10000，本版已收回。
  FACTORY_SIZE: '11272192'

jobs:
  build:
    runs-on: ubuntu-22.04
    # Plan E 曾卡满 6 小时（defconfig 后改 .config 导致交互式 kconfig 阻塞）。
    # 改成 150 分钟：正常一次约 40 分钟，卡死也不会拖到天亮。
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - name: 检出构建配置
        uses: actions/checkout@v5

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          docker-images: true
          swap-storage: false

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pip python3-ply rsync unzip zlib1g-dev file wget qemu-utils ccache
          sudo timedatectl set-timezone Asia/Shanghai || true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 缓存 ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ env.REPO_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.REPO_BRANCH }}-

      - name: 克隆源码
        run: |
          rm -rf openwrt
          git clone --depth=1 --single-branch -b "${{ env.REPO_BRANCH }}" "${{ env.REPO_URL }}" openwrt
          cd openwrt && git log -1 --pretty=format:'源码版本: %h %s%n'

      - name: 缓存下载目录（克隆之后再恢复）
        uses: actions/cache@v5
        with:
          path: openwrt/dl
          key: dl-${{ env.REPO_BRANCH }}-${{ hashFiles('configs/*.config') }}
          restore-keys: |
            dl-${{ env.REPO_BRANCH }}-

      - name: 加载 feeds 与种子配置（第一步）
        timeout-minutes: 30
        run: |
          cd openwrt
          cp ../configs/mt7620a-16m.config .config
          if [ -f ../feeds.conf ]; then cp ../feeds.conf feeds.conf; fi
          bash ../scripts/diy-part1.sh
          make defconfig < /dev/null 2>&1 | tee /tmp/defconfig.log

          if grep -q 'changes choice state' /tmp/defconfig.log; then
            echo "::error::种子配置里有多个板型 =y，kconfig choice 互相覆盖"
            grep 'changes choice state' /tmp/defconfig.log || true
            exit 1
          fi

          if ! grep -qx "CONFIG_TARGET_ramips_mt7620_DEVICE_${DEVICE_ID}=y" .config; then
            echo "::error::自建板型 ${DEVICE_ID} 没有被选中，构建会产出别人的固件"
            grep -E 'CONFIG_TARGET_ramips_mt7620_DEVICE_.*=y' .config || true
            exit 1
          fi

          if ! grep -qx 'CONFIG_TARGET_ROOTFS_SQUASHFS=y' .config; then
            echo "::error::CONFIG_TARGET_ROOTFS_SQUASHFS 未生效，只会产出 initramfs-kernel"
            exit 1
          fi

          echo "==> 板型与 rootfs 类型校验通过"

      - name: 注入自定义内容（第二步）
        run: |
          cd openwrt
          bash ../scripts/diy-part2.sh

      - name: 校验目标与板型
        run: |
          cd openwrt
          echo "=== 目标 / 子目标 / 板型 ==="
          grep -E '^CONFIG_TARGET_(ramips|ramips_mt7620|ramips_mt7620_DEVICE_)=' .config
          echo "=== 镜像类型 ==="
          grep -E '^CONFIG_TARGET_(ROOTFS_SQUASHFS|IMAGES_GZIP|MULTI_PROFILE)=' .config || true

          echo "=== 板级定义是否真的进了源码树 ==="
          grep -q "define Device/${DEVICE_ID}" target/linux/ramips/image/mt7620.mk \
            || { echo "::error::mt7620.mk 缺少 Device/${DEVICE_ID}"; exit 1; }
          grep -n "TARGET_DEVICES += ${DEVICE_ID}" target/linux/ramips/image/mt7620.mk \
            || { echo "::error::mt7620.mk 缺少 TARGET_DEVICES += ${DEVICE_ID}"; exit 1; }
          ls -l "target/linux/ramips/dts/mt7620a_${DEVICE_ID}.dts" \
            || { echo "::error::板级 DTS 未注入源码树"; exit 1; }

          echo "=== 方案C 校验：DTS 里 watchdog 必须是 disabled ==="
          grep -A3 '&watchdog {' "target/linux/ramips/dts/mt7620a_${DEVICE_ID}.dts" \
            | grep -q 'disabled' \
            || { echo "::error::DTS 未禁用 watchdog"; exit 1; }

          echo "=== 对齐原厂校验：cmdline 必须带 clk_ignore_unused ==="
          grep -q 'clk_ignore_unused' "target/linux/ramips/dts/mt7620a_${DEVICE_ID}.dts" \
            || { echo "::error::bootargs 未加 clk_ignore_unused（原厂从不关时钟）"; exit 1; }

          echo "=== 镜像尺寸必须等于原厂 0xAC0000 ==="
          grep -q 'pad-to 11272192' target/linux/ramips/image/mt7620.mk \
            || { echo "::error::镜像未 pad-to 11272192（0xAC0000）"; exit 1; }

          echo "=== board.d 网络脚本 ==="
          ls -l files/etc/board.d/ || { echo "::error::board.d 未注入"; exit 1; }
          grep -q 'ucidef_add_switch' files/etc/board.d/02_network_sl-ir4 \
            || { echo "::error::02_network_sl-ir4 缺少交换机定义"; exit 1; }

          echo "=== 关键包（LuCI / 4G / 交换机）==="
          grep -E "CONFIG_PACKAGE_(luci|ttyd|htop|uqmi|usb-modeswitch)=" .config | head -20
          grep -E "CONFIG_PACKAGE_(kmod-usb-net-qmi-wwan|kmod-usb-serial-option|swconfig|kmod-rt2800-soc)=" .config

      - name: 下载源码包
        timeout-minutes: 40
        run: |
          set -o pipefail
          cd openwrt
          timeout 35m make -j$(nproc) download < /dev/null 2>&1 | tee download.log \
            || timeout 30m make -j1 V=s download < /dev/null 2>&1 | tee download-detail.log

      - name: 编译固件
        timeout-minutes: 110
        run: |
          set -o pipefail
          cd openwrt
          # < /dev/null 是关键：任何 kconfig/脚本想读标准输入就会立即 EOF，
          # 不会像 Plan E 那样静默卡死到 6 小时超时。
          if timeout 100m make -j$(nproc) < /dev/null 2>&1 | tee build.log; then
            exit 0
          fi
          echo "::warning::首次构建失败或被 timeout 终止，重跑详细日志定位真正的错误行"
          timeout 40m make -j1 V=s < /dev/null 2>&1 | tee build-detail.log || true
          echo "===== 错误摘要（error / Error） ====="
          grep -n -iE "error:|Error [0-9]|fatal error|undefined reference|No rule to make target|Terminated" build-detail.log | tail -n 80 || true
          echo "===== 详细日志尾部 150 行 ====="
          tail -n 150 build-detail.log || true
          exit 1

      - name: 核对产物（尺寸不符直接失败）
        if: success()
        run: |
          cd openwrt
          ls -l bin/targets/ramips/mt7620/ || true
          grep -i 'is too big' build.log || echo "无尺寸告警"

          FACTORY=$(ls bin/targets/ramips/mt7620/*"${DEVICE_ID}"-squashfs-factory.bin 2>/dev/null | head -1)
          if [ -z "$FACTORY" ]; then
            echo "::error::未生成 ${DEVICE_ID}-squashfs-factory.bin"
            exit 1
          fi
          SZ=$(stat -c %s "$FACTORY")
          echo "factory.bin = $FACTORY ($SZ bytes)"
          if [ "$SZ" != "${FACTORY_SIZE}" ]; then
            echo "::error::factory.bin 尺寸 $SZ ≠ ${FACTORY_SIZE}（原厂 0xAC0000）"
            exit 1
          fi

          SYSUP=$(ls bin/targets/ramips/mt7620/*"${DEVICE_ID}"-squashfs-sysupgrade.bin 2>/dev/null | head -1)
          [ -n "$SYSUP" ] || { echo "::error::未生成 squashfs-sysupgrade.bin"; exit 1; }
          echo "sysupgrade.bin = $SYSUP ($(stat -c %s "$SYSUP") bytes)"

      - name: 收集固件
        if: success()
        run: |
          mkdir -p output
          find openwrt/bin/targets/ramips/mt7620 -maxdepth 1 -type f \
            \( -name "*.bin" -o -name "*.itb" -o -name "sha256sums" \) \
            -exec cp {} output/ \;
          cd output
          ls -lh
          sha256sum $(ls | grep -v SHA256SUMS.txt) > SHA256SUMS.txt || true

      - name: 上传固件 Artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: mt7620a-firmware-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: success() && (github.event.inputs.tag != '' || inputs.tag != '' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || inputs.tag || github.ref_name }}
          name: MT7620A 固件 ${{ github.event.inputs.tag || inputs.tag || github.ref_name }}
          body: |
            自动云编译产物（ImmortalWrt ${{ env.REPO_BRANCH }}，ramips/mt7620）。
            刷机前请先确认机型与闪存容量，见仓库 README。
          files: output/*
          draft: false
          prerelease: false

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ github.run_number }}
          path: |
            openwrt/build.log
            openwrt/build-detail.log
            openwrt/download.log
            openwrt/download-detail.log
            /tmp/defconfig.log
          if-no-files-found: ignore
